name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          unzip -o 'みんなのAIガチャ図鑑_完成版.zip' -d temp_project
          cp -a temp_project/. .
          rm -rf temp_project
          rm -f 'みんなのAIガチャ図鑑_完成版.zip'

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add project source"
          git push
