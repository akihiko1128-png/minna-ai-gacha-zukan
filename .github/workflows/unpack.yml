name: プロジェクトを展開する

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: ZIPファイルを解凍する
        run: |
          unzip -o 'みんなのAIガチャ図鑑_変更版.zip' -d temp_project
          cp -a temp_project/. .
          rm -rf temp_project
          rm -f 'みんなのAIガチャ図鑑_変更版.zip'

      - name: ファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply latest modified version"
          git push
